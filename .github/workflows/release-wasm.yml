name: Release WASM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(jq -er '.version | select(type == "string" and length > 0)' package.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null; then
            printf 'Release tag %s already exists.\n' "$TAG" >&2
            exit 1
          fi

      - name: Build WASM
        run: bun run build

      - name: Verify WASM output
        run: test -s build/tree-sitter-mcfunction.wasm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            build/tree-sitter-mcfunction.wasm \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
